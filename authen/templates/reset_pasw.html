{% extends 'main.html' %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'CSS/reset_pasw.css' %}">
{% endblock %}
{% block content %}
<div class="reset-password-container">
    <div class="reset-password-box">
    <h1>Reset Password Page</h1>
        {% if messages %}
            {% for i in messages %}
                <h2 style="color: red;">{{i}}</h2> <br><br>
            {% endfor %}
        {% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <label for="">UserName:</label>
            <input type="text" name="uname" value="{{request.user.username}}" disabled> <br><br>
            {% if new %}
                <label for="">New Password:</label>
                <input type="password" name="new_pasw"> <br><br>

                <label for="">Confirm Password:</label>
                <input type="password" name="con_pasw"> <br><br>
            {% else %}
                <label for="">Old Password:</label>
                <input type="password" name="old_pasw" id=""> <br><br>
            {% endif %}
            <button type="submit">Reset</button> <br><br>
        </form>
</div>

</div>
{% endblock %}
