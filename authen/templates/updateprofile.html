{% extends 'main.html' %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'CSS/updateprofile.css' %}">
{% endblock %}
{% block content %}
<h1 class="update-title">Update Profile</h1>
<div class="update-container">
    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="">First Name:</label>
        <input type="text" name="fname" id="" value="{{request.user.first_name}}">
        <label for="">Last Name:</label>
        <input type="text" name="lname" id="" value="{{request.user.last_name}}">
        <label for="">Email:</label>
        <input type="email" name="email" id="" value="{{request.user.email}}">
        <label for="">Student Image</label>
        <input type="file" name="pic" id=""> <br> <br>
        <button type="submit">Update</button>
    </form>
</div>
{% endblock %}
