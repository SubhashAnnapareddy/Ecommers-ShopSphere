{% extends 'main.html' %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'CSS/login_.css' %}">
{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>Login</h1>
        <form action="" method="POST" class="login-form">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" name="uname" placeholder="Enter your username" required>

            <label for="password">Password:</label>
            <input type="password" name="pasw" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>
        <div class="login-links">
            <a href="{% url 'register' %}">New User? Register here!</a>
            <a href="{% url 'forget_pasw' %}">Forgot Password?</a>
        </div>
    </div>
</div>
{% endblock %}
